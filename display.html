<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>הלוח המשפחתי – תצוגת E-Ink</title>
<style>
:root{color-scheme:light;--ink:#242424;--muted:#666;--line:#d8d5ce;--paper:#fcfbf7;--soft:#f3f1eb}*{box-sizing:border-box}body{margin:0;background:#e9e8e4;color:var(--ink);font-family:Arial,'Noto Sans Hebrew',sans-serif}button{font:inherit;cursor:pointer;background:transparent;color:inherit;border:1px solid #c9c6bf;border-radius:8px;padding:8px 13px}button.active{background:#292929;color:white}.screen{width:min(100%,1600px);min-height:800px;margin:18px auto;background:var(--paper);padding:28px 34px;box-shadow:0 5px 24px #0001;display:flex;flex-direction:column;gap:18px}.top{display:grid;grid-template-columns:minmax(260px,1.5fr) minmax(220px,1fr) minmax(210px,1fr) auto;align-items:center;gap:25px;padding-bottom:18px;border-bottom:1px solid var(--line)}h1{font-size:clamp(26px,2.7vw,42px);margin:0 0 8px;font-weight:700;letter-spacing:-.04em}.range{color:var(--muted);font-size:19px}.smallheading{font-size:15px;font-weight:700;margin-bottom:8px}.joke{font-size:17px;line-height:1.6}.weather{display:flex;gap:12px;align-items:center}.weather .symbol{font-size:39px}.weather strong{font-size:29px}.weather p{margin:2px 0;font-size:15px}.controls{display:flex;flex-direction:column;gap:8px;align-items:flex-start}.controls .line{display:flex;gap:6px}.controls button{white-space:nowrap}.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));flex:1;min-height:520px}.day{min-width:0;border-left:1px solid var(--line);padding:0 12px;display:flex;flex-direction:column}.day:last-child{border-left:0}.day.today{background:#f3f0e9}.dayhead{padding:7px 0 17px;border-bottom:1px solid var(--line);margin-bottom:12px}.dayhead .name{font-size:24px;font-weight:700}.dayhead .date{font-size:17px;color:#555;margin-top:5px}.events{flex:1}.event{padding:12px 0;border-bottom:1px solid #e6e3dd;text-align:right;line-height:1.4;overflow-wrap:anywhere}.event .time{font-size:14px;color:#666;margin-bottom:5px}.event .title{font-size:18px;font-weight:600}.event .people{font-size:13px;color:#666;margin-top:5px}.rewards{border-top:1px dashed #bcb8b0;padding-top:12px;display:grid;gap:9px}.reward{display:flex;justify-content:space-between;align-items:center;font-size:15px}.reward .symbol{font-size:25px;font-weight:700}.shabbat{border:1px solid #aaa;padding:9px;margin-top:12px;font-size:14px;line-height:1.6}.alert{border:2px solid #222;padding:14px 18px;font-size:20px;font-weight:700;display:flex;gap:12px}.alert[hidden]{display:none}.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(90px,1fr);flex:1;gap:0;border-top:1px solid var(--line);border-right:1px solid var(--line)}.monthcell{border-left:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px;min-width:0}.monthcell strong{font-size:18px}.monthcell p{font-size:13px;margin:6px 0}.monthcell.outside{color:#aaa;background:#f8f7f4}.monthcell.today{background:#f1eee7}.foot{color:#777;font-size:12px;text-align:left}.notice{font-size:12px;color:#777}@media(max-width:850px){.screen{width:1450px;margin:0;padding:25px}.top{grid-template-columns:1.4fr 1fr 1fr auto}body{overflow-x:auto}}
</style></head>
<body><main class="screen"><header class="top"><div><h1>היומן המשפחתי שלנו</h1><div class="range" id="range"></div></div><section><div class="smallheading">הבדיחה היומית</div><div class="joke" id="joke"></div></section><section><div class="weather"><div class="symbol">☀</div><div><strong>—°</strong><p>מזג אוויר יתחבר בהמשך</p><p>המלצת לבוש תופיע כאן</p></div></div></section><nav class="controls"><div class="line"><button id="prev" aria-label="הקודם">→</button><button id="today">היום</button><button id="next" aria-label="הבא">←</button></div><div class="line"><button id="week" class="active">שבוע</button><button id="month">חודש</button></div></nav></header><div class="week" id="weekGrid"></div><div class="month" id="monthGrid" hidden></div><section class="alert" id="alert" hidden><span>! חשוב</span><span id="alertText"></span></section><footer class="foot">הדמיית עיצוב בלבד · ללא חיבור ל-Supabase · זמני שבת ומזג אוויר אינם נתונים חיים</footer></main>
<script>
const names=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];const months=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];const sample=[ [{time:'08:00',title:'בית ספר',people:'תמרה, יהונתן'},{time:'16:00',title:'חוג כדורגל',people:'יהונתן'}],[{time:'08:00',title:'בית ספר',people:''},{time:'16:30',title:'חוג שחייה',people:'תמרה'}],[{time:'14:30',title:'רופא שיניים',people:'תמרה'}],[{time:'16:00',title:'חוג מוזיקה',people:'יהונתן'},{time:'19:00',title:'קניות בסופר',people:''}],[{time:'15:30',title:'חוג אמנות',people:'תמרה'},{time:'17:30',title:'מפגש חברים',people:''}],[{time:'08:00',title:'בית ספר',people:''},{time:'16:00',title:'הכנות לשבת',people:''}],[{time:'10:00',title:'טיול משפחתי בפארק',people:''}] ];const jokes=['למה הדג לא אוהב מחשבים? כי הוא מפחד מהרשת!','למה הספר הלך לרופא? כי היו לו יותר מדי עמודים כואבים!','מה אמר העיפרון למחק? טוב שאתה כאן כשאני טועה!','למה העגבנייה הסמיקה? כי היא ראתה את הסלט!'];const add=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x};const start=d=>add(d,-d.getDay());const same=(a,b)=>a.toDateString()===b.toDateString();let anchor=new Date(),mode='week';const demoStart=new Date(2026,9,18);const fmt=d=>`${d.getDate()}.${String(d.getMonth()+1).padStart(2,'0')}`;function draw(){let s=start(anchor),end=add(s,6);document.getElementById('range').textContent=mode==='week'?`${s.getDate()}–${end.getDate()} ${months[end.getMonth()]} ${end.getFullYear()}`:`${months[anchor.getMonth()]} ${anchor.getFullYear()}`;document.getElementById('joke').textContent=jokes[Math.floor(Date.now()/86400000)%jokes.length];document.getElementById('week').classList.toggle('active',mode==='week');document.getElementById('month').classList.toggle('active',mode==='month');document.getElementById('weekGrid').hidden=mode!=='week';document.getElementById('monthGrid').hidden=mode!=='month';if(mode==='week'){document.getElementById('weekGrid').innerHTML=names.map((name,i)=>{let d=add(s,i), demo=same(s,demoStart), ev=demo?sample[i]:[], reward=demo&&i%3===0;return `<article class="day ${same(d,new Date())?'today':''}"><div class="dayhead"><div class="name">${name}</div><div class="date">${fmt(d)}</div></div><div class="events">${ev.map(e=>`<div class="event"><div class="time">${e.time}</div><div class="title">${e.title}</div>${e.people?`<div class="people">${e.people}</div>`:''}</div>`).join('')}${i===5&&demo?'<div class="shabbat"><strong>יום שישי</strong><br>זמני הדלקת נרות וכניסת שבת יוצגו כאן ביום שישי בלבד, לאחר חיבור לשירות זמני שבת בגאולים.</div>':''}</div><div class="rewards"><div class="reward"><span>תמרה</span><span class="symbol">${reward?'♥':'—'}</span></div><div class="reward"><span>יהונתן</span><span class="symbol">${demo&&i%3===1?'♛':'—'}</span></div></div></article>`}).join('')}else{let first=new Date(anchor.getFullYear(),anchor.getMonth(),1),gridStart=start(first);document.getElementById('monthGrid').innerHTML=Array.from({length:42},(_,i)=>{let d=add(gridStart,i),inside=d.getMonth()===anchor.getMonth();return `<div class="monthcell ${inside?'':'outside'} ${same(d,new Date())?'today':''}"><strong>${d.getDate()}</strong>${inside&&same(start(d),demoStart)?'<p>אירועים לדוגמה</p>':''}</div>`}).join('')}}document.getElementById('prev').onclick=()=>{anchor=add(anchor,mode==='week'?-7:-30);if(mode==='month')anchor=new Date(anchor.getFullYear(),anchor.getMonth(),1);draw()};document.getElementById('next').onclick=()=>{anchor=add(anchor,mode==='week'?7:32);if(mode==='month')anchor=new Date(anchor.getFullYear(),anchor.getMonth(),1);draw()};document.getElementById('today').onclick=()=>{anchor=new Date();draw()};document.getElementById('week').onclick=()=>{mode='week';draw()};document.getElementById('month').onclick=()=>{mode='month';draw()};draw();
</script></body></html>
