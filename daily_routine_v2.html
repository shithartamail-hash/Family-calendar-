   return `<section class="quick-day ${date===todayKey?'today':''}"><h3>${days[i]} · ${d.getDate()}/${d.getMonth()+1}</h3>${fields.map(f=>{
     const qk=quickKey(date,f.key);
     return `<div class="quick-field ${quickChanged(date,f.key)?'modified':''}"><label for="quick-${i}-${f.key}"><span>${f.icon} ${f.title}</span><span class="quick-share"><input type="checkbox" data-quick-share="${qk}" ${quickShare[qk]?'checked':''}> גם לילד השני</span></label><input id="quick-${i}-${f.key}" type="text" data-quick-date="${date}" data-quick-field="${f.key}" maxlength="500" value="${esc(r[f.key]||'')}"></div>`}).join('')}</section>`
 }).join('');
}
$('quickOpen').onclick=quickOpen;
$('quickClose').onclick=()=>{if(quickBusy)return;if(Object.keys(quickDraft).some(dt=>fields.some(f=>quickChanged(dt,f.key)))&&!confirm('לצאת בלי לשמור את השינויים?'))return;quickDismiss()};
function quickDismiss(){$('quickBackdrop').classList.remove('open');$('quickBackdrop').setAttribute('aria-hidden','true');quickDraft={};quickShare={};quickOriginal={};refresh()}
$('quickDays').addEventListener('input',e=>{const el=e.target;if(!el.matches('[data-quick-field]'))return;const date=el.dataset.quickDate,field=el.dataset.quickField;if(!quickDraft[date])return;quickDraft[date][field]=el.value;el.closest('.quick-field')?.classList.toggle('modified',quickChanged(date,field))});
$('quickDays').addEventListener('change',e=>{const el=e.target;if(el.matches('[data-quick-share]'))quickShare[el.dataset.quickShare]=el.checked});
$('quickCopy').onclick=async()=>{
 if(quickBusy)return;
 if(!confirm('למלא את המשבצות הריקות מתוך השבוע הקודם? נתונים שכבר קיימים בשבוע הנוכחי לא יוחלפו. השמירה תתבצע רק אם תלחצו ״שמור שינויים״.'))return;
 const a=add(anchor,-7),b=add(anchor,-1);
 try{
  quickBusy=true;$('quickCopy').disabled=true;quickSetMessage('טוען את השבוע הקודם…');
  const {data,error}=await db.from('child_daily_plans').select('*').eq('child',child).gte('plan_date',dateOnly(a)).lte('plan_date',dateOnly(b));if(error)throw error;
  let num=0;
  thisWeek().forEach((d,i)=>{const old=dateOnly(add(a,i)),cur=dateOnly(d),prev=(data||[]).find(r=>r.plan_date===old)||{};fields.forEach(f=>{if(!(quickDraft[cur]?.[f.key]||'').trim()&&(prev[f.key]||'').trim()){quickDraft[cur][f.key]=prev[f.key];num++}})});
  quickRender();quickSetMessage(num?`הועתקו ${num} משבצות ריקות. אפשר לערוך ולשמור.`:'לא היו משבצות ריקות להשלמה מהשבוע הקודם.');
 }catch(e){quickSetMessage('ההעתקה נכשלה: '+e.message,true)}finally{quickBusy=false;$('quickCopy').disabled=false}
};
$('quickSave').onclick=async()=>{
 if(quickBusy)return;
 const changes=[];
 thisWeek().forEach(d=>{const dt=dateOnly(d);fields.forEach(f=>{if(quickChanged(dt,f.key)){changes.push({date:dt,field:f.key,value:(quickDraft[dt][f.key]||'').trim(),share:!!quickShare[quickKey(dt,f.key)]})}})});
 if(!changes.length){quickSetMessage('אין שינויים לשמירה.');return}
 const shared=changes.filter(c=>c.share);
 if(shared.length&&!confirm(`לשמור ${changes.length} שינויים? ${shared.length} מהם יועתקו גם לילד השני ועשויים להחליף ערכים קיימים אצלו.`))return;
 quickBusy=true;$('quickSave').disabled=true;$('quickCopy').disabled=true;$('quickClose').disabled=true;
 try{
  quickSetMessage('שומר את השינויים…');
  // Read fresh rows so unrelated fields aren't overwritten by stale drafts.
  const from=dateOnly(anchor),to=dateOnly(add(anchor,6));
  const {data,error}=await db.from('child_daily_plans').select('*').in('child',[child,otherChild()]).gte('plan_date',from).lte('plan_date',to);
  if(error)throw error;
  const existing=new Map((data||[]).map(r=>[r.child+'|'+r.plan_date,r]));
  const affected=new Map();
  function stage(kid,dt,f,value){const k=kid+'|'+dt;const row=affected.get(k)||{...(existing.get(k)||{}),child:kid,plan_date:dt};fields.forEach(x=>{if(row[x.key]==null)row[x.key]=''});row[f]=value;row.updated_at=new Date().toISOString();affected.set(k,row)}
  changes.forEach(c=>{stage(child,c.date,c.field,c.value);if(c.share)stage(otherChild(),c.date,c.field,c.value)});
  // Explicit upserts, one at a time; report partial errors honestly.
  let completed=0;for(const record of affected.values()){
    const {error:saveError}=await db.from('child_daily_plans').upsert({child:record.child,plan_date:record.plan_date,morning:record.morning||'',food:record.food||'',pickup:record.pickup||'',afternoon:record.afternoon||'',updated_at:record.updated_at},{onConflict:'child,plan_date'});
    if(saveError)throw new Error(`נשמרו ${completed} מתוך ${affected.size} ימים לילדים. ${saveError.message}`);
    completed++;
  }
  quickSetMessage('כל השינויים נשמרו.');quickDismiss();
 }catch(e){quickSetMessage('השמירה לא הושלמה: '+e.message,true)}
 finally{quickBusy=false;$('quickSave').disabled=false;$('quickCopy').disabled=false;$('quickClose').disabled=false}
};

db.auth.getSession().then(({data})=>{if(!data.session){$('message').textContent='יש להתחבר קודם ל-Sinai';return}refresh()});
db.channel('daily-plan-'+child).on('postgres_changes',{event:'*',schema:'public',table:'child_daily_plans'},()=>refresh()).on('postgres_changes',{event:'*',schema:'public',table:'daily_rewards'},()=>refresh()).subscribe();setInterval(()=>{if(!document.hidden)refresh()},60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
</script></body></html>
