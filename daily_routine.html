<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:var(--bg);color:var(--ink)}.page{height:100dvh;min-height:0;display:flex;flex-direction:column;gap:11px;padding:14px max(11px,env(safe-area-inset-right)) 12px max(11px,env(safe-area-inset-left));overflow:hidden}header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none}h1{font-size:clamp(17px,2.1vw,24px);margin:0 0 3px}small{color:var(--muted);font-size:12px}.nav{display:flex;gap:6px;align-items:center}.nav button{border:1px solid var(--stroke);background:var(--tile);color:var(--ink);border-radius:10px;padding:8px 11px;font:inherit;font-size:13px;min-height:36px}.tip{font-size:11px;color:var(--muted);min-height:14px}.routine-scroll{min-height:0;flex:1;overflow-x:auto;overflow-y:hidden;overscroll-behavior:contain}main{height:100%;min-height:0;display:grid;grid-template-columns:minmax(60px,92px) repeat(7,minmax(0,1fr));grid-template-rows:minmax(43px,.64fr) repeat(4,minmax(0,1fr)) minmax(60px,.78fr);gap:5px;direction:rtl}.head,.label,.cell,.reward{border-radius:9px;min-width:0;min-height:0;display:flex;justify-content:center;align-items:center;text-align:center;padding:5px;overflow:hidden}.head{background:var(--head);flex-direction:column;gap:3px;font-size:clamp(10px,1.6vw,15px);font-weight:600}.head .dt{font-size:11px;color:var(--muted);font-weight:400}.head.today{outline:2px solid var(--accent)}.label{background:var(--head);flex-direction:column;gap:3px;font-size:clamp(10px,1.55vw,13px);font-weight:600}.label .ico{font-size:clamp(19px,2.7vw,29px)}.cell.today,.reward.today{background:var(--selected);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.head.today{background:var(--selected);outline:2px solid var(--accent);outline-offset:-2px}.cell{background:var(--tile);border:1px solid var(--stroke);font:inherit;font-size:clamp(10px,1.65vw,15px);white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.26;cursor:pointer;color:var(--ink)}.cell:focus-visible,.reward:focus-visible{outline:3px solid var(--accent)}.cell.empty:after{content:'＋';font-size:19px;opacity:.3}.cell[disabled],.reward[disabled]{cursor:default;opacity:1}.cell[disabled].empty:after{content:''}.reward{background:var(--tile);border:1px solid var(--stroke);color:var(--muted);font-size:clamp(24px,3.8vw,40px);cursor:pointer}.reward.earned{color:#cc697c;background:color-mix(in srgb,var(--tile),#f5a6b0 17%)}.reward.crown.earned{color:#b78a34;background:color-mix(in srgb,var(--tile),#f4df94 17%)}.reward[disabled]{opacity:1;cursor:default}.corner{background:transparent}
.editor-backdrop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0007;z-index:10;padding:20px}.editor-backdrop.open{display:flex}.editor{background:var(--tile);color:var(--ink);border-radius:17px;padding:20px;width:min(460px,96vw);box-shadow:0 10px 40px #0003}.editor h2{font-size:18px;margin:0 0 12px}.editor textarea{width:100%;min-height:100px;resize:vertical;font:inherit;font-size:16px;line-height:1.5;padding:11px;border:1px solid var(--stroke);border-radius:10px;background:var(--bg);color:var(--ink)}.editor-actions{display:flex;gap:8px;margin-top:12px}.editor-actions button{flex:1;padding:11px;border-radius:9px;border:1px solid var(--stroke);background:var(--head);color:var(--ink);font:inherit}.editor-actions button.save{background:var(--accent);color:#fff}.error{color:#bf5c51;min-height:16px;font-size:12px;margin-top:6px}
@media(max-width:730px){.page{gap:6px;padding:8px}main{gap:3px;min-width:910px;grid-template-columns:98px repeat(7,minmax(112px,1fr));grid-template-rows:42px repeat(4,minmax(0,1fr)) 57px}.head,.label,.cell,.reward{border-radius:6px;padding:3px}.head{font-size:10px}.head .dt{font-size:9px}.label{font-size:11px;position:sticky;right:0;z-index:2}.label .ico{font-size:19px}.cell{font-size:12px}h1{font-size:17px}.nav button{padding:6px;font-size:11px}.tip{font-size:10px}}
@media(max-height:480px){.page{gap:5px;padding-top:7px;padding-bottom:5px}.tip{display:none}header h1{font-size:16px}.nav button{min-height:30px;padding:4px 8px}}
</style></head><body><div class="page"><header><div><h1 id="title">הטבלה היומית</h1><small id="subtitle">ממלאים באפליקציה · מוצג גם בלוח המשפחתי</small></div><div class="nav"><button type="button" id="back" aria-label="שבוע קודם">→</button><button type="button" id="now">השבוע</button><button type="button" id="forward" aria-label="שבוע הבא">←</button></div></header><div class="tip" id="message" role="status">טוען את השבוע…</div><div class="routine-scroll"><main id="table" aria-label="טבלה יומית לשבוע"></main></div></div>
<div class="editor-backdrop" id="backdrop"><div class="editor" role="dialog" aria-modal="true" aria-labelledby="editorTitle"><h2 id="editorTitle">עריכת יום</h2><textarea id="value" maxlength="500" placeholder="אפשר לכתוב כאן…"></textarea><div class="error" id="editorError"></div><div class="editor-actions"><button id="cancel">ביטול</button><button id="clear">ניקוי</button><button class="save" id="save">שמירה</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SB_URL='https://pkghylgchdnykgamahjh.supabase.co',SB_KEY='sb_publishable_TlZtdKg6YXzgggxFpBbPhQ_FghbB3Ap';
const db=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const params=new URLSearchParams(location.search);const child=['tamara','yehonatan'].includes(params.get('child'))?params.get('child'):'tamara';const readOnly=params.get('readonly')==='1';const kid=child==='tamara'?'תמרה':'יהונתן';
const fields=[{key:'morning',title:'מי לוקח בבוקר',icon:'☀️'},{key:'food',title:'מה אוכלים',icon:'🍽️'},{key:'pickup',title:'מי מחזיר',icon:'🚗'},{key:'afternoon',title:'אחר הצהריים',icon:'😊'}];const days=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayIsrael=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jerusalem',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());const dateOnly=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const add=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);const sow=d=>add(d,-d.getDay());let anchor=sow(new Date()),entries=[],rewards=[],editing=null,busy=false;const thisWeek=()=>Array.from({length:7},(_,i)=>add(anchor,i));
$('title').textContent='הטבלה היומית של '+kid; $('subtitle').textContent=readOnly?'תצוגה משפחתית · עריכה דרך האפליקציה בטלפון':'נוגעים במשבצת כדי למלא או לערוך';
function theme(){const explicit=params.get('theme');let t=explicit;if(!['light','dark'].includes(t)){try{t=localStorage.getItem('sinai-theme-pref')||localStorage.getItem('sinai-theme')}catch{}} document.documentElement.dataset.theme=t==='dark'?'dark':'light'}theme();window.addEventListener('message',e=>{if(e.origin!==location.origin)return;if(e.data?.type==='sinai-theme'){document.documentElement.dataset.theme=e.data.theme==='dark'?'dark':'light'}});
function row(date){return entries.find(r=>r.plan_date===date&&r.child===child)||{child,plan_date:date,morning:'',food:'',pickup:'',afternoon:''}}
function render(){const daysArr=thisWeek();const todayKey=todayIsrael();let html='<div class="corner"></div>';daysArr.forEach((d,i)=>{const key=dateOnly(d);html+=`<div class="head ${key===todayKey?'today':''}">${days[i]}<span class="dt">${d.getDate()}/${d.getMonth()+1}</span></div>`});fields.forEach(f=>{html+=`<div class="label" title="${f.title}" aria-label="${f.title}"><span class="ico" aria-hidden="true">${f.icon}</span></div>`;daysArr.forEach(d=>{const key=dateOnly(d),v=row(key)[f.key]||'';html+=`<button class="cell ${v?'':'empty'} ${key===todayKey?'today':''}" ${readOnly?'disabled':''} data-date="${key}" data-field="${f.key}" aria-label="${f.title}, ${key}">${esc(v)}</button>`})});html+=`<div class="label" title="${child==='tamara'?'הלב של תמרה':'הכתר של יהונתן'}"><span class="ico" aria-hidden="true">${child==='tamara'?'♡':'♕'}</span></div>`;daysArr.forEach(d=>{const key=dateOnly(d),earned=rewards.some(r=>r.reward_date===key&&r.child===child);html+=`<button class="reward ${child==='yehonatan'?'crown':''} ${earned?'earned':''} ${key===todayKey?'today':''}" data-reward="${key}" ${readOnly?'disabled':''} aria-label="${earned?'ביטול':'מתן'} ${child==='tamara'?'לב':'כתר'} ביום ${key}" aria-pressed="${earned}">${child==='tamara'?(earned?'♥':'♡'):(earned?'♛':'♕')}</button>`});$('table').innerHTML=html}
async function refresh(){const ds=dateOnly(anchor),de=dateOnly(add(anchor,6));try{const [p,r]=await Promise.all([db.from('child_daily_plans').select('*').eq('child',child).gte('plan_date',ds).lte('plan_date',de),db.from('daily_rewards').select('id,reward_date,child').eq('child',child).gte('reward_date',ds).lte('reward_date',de)]);if(p.error)throw p.error;if(r.error)throw r.error;entries=p.data||[];rewards=r.data||[];$('message').textContent=readOnly?'הנתונים מתעדכנים אוטומטית':'לחצו על משבצת כדי לערוך · אפשר לעבור בין שבועות';render()}catch(err){$('message').textContent='לא ניתן לטעון את הטבלה: '+err.message}}
$('table').addEventListener('click',async ev=>{if(readOnly||busy)return;const cell=ev.target.closest('[data-field]');if(cell){editing={date:cell.dataset.date,field:cell.dataset.field};$('editorTitle').textContent=kid+' · '+fields.find(f=>f.key===editing.field).title+' · '+editing.date.split('-').reverse().join('/');$('value').value=row(editing.date)[editing.field]||'';$('editorError').textContent='';$('backdrop').classList.add('open');$('value').focus();return}const btn=ev.target.closest('[data-reward]');if(btn){busy=true;btn.disabled=true;const date=btn.dataset.reward,existing=rewards.find(r=>r.child===child&&r.reward_date===date);const res=existing?await db.from('daily_rewards').delete().eq('id',existing.id):await db.from('daily_rewards').insert({child,reward_date:date});if(res.error)alert('שמירת הסימון נכשלה: '+res.error.message);await refresh();busy=false}});
function closeEditor(){$('backdrop').classList.remove('open');editing=null}
$('cancel').onclick=closeEditor;$('backdrop').addEventListener('click',e=>{if(e.target===$('backdrop'))closeEditor()});
$('clear').onclick=()=>{$('value').value='';$('value').focus()};
$('save').onclick=async()=>{if(!editing||busy)return;busy=true;$('save').disabled=true;const current=row(editing.date);const payload={child,plan_date:editing.date,morning:current.morning||'',food:current.food||'',pickup:current.pickup||'',afternoon:current.afternoon||'',[editing.field]:$('value').value.trim(),updated_at:new Date().toISOString()};const result=await db.from('child_daily_plans').upsert(payload,{onConflict:'child,plan_date'});if(result.error){$('editorError').textContent=result.error.message}else{closeEditor();await refresh()}busy=false;$('save').disabled=false};
$('back').onclick=()=>{anchor=add(anchor,-7);refresh()};$('forward').onclick=()=>{anchor=add(anchor,7);refresh()};$('now').onclick=()=>{anchor=sow(new Date());refresh()};
db.auth.getSession().then(({data})=>{if(!data.session){$('message').textContent='יש להתחבר קודם ל-Sinai';return}refresh()});
db.channel('daily-plan-'+child).on('postgres_changes',{event:'*',schema:'public',table:'child_daily_plans'},()=>refresh()).on('postgres_changes',{event:'*',schema:'public',table:'daily_rewards'},()=>refresh()).subscribe();setInterval(()=>{if(!document.hidden)refresh()},60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
</script></body></html>
