<script>
/* ---- Supabase settings (public values, safe to keep here; protection comes from login + RLS) ---- */
const SB_URL='https://pkghylgchdnykgamahjh.supabase.co';
const SB_KEY='sb_publishable_TlZtdKg6YXzgggxFpBbPhQ_FghbB3Ap';
const db=supabase.createClient(SB_URL,SB_KEY);

const $=s=>document.querySelector(s);
const DAYS=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const MON=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const sow=d=>addD(d,-d.getDay());
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let viewMode='week',openedDay=null,selectedMonthDay=iso(new Date()),themePref=localStorage.getItem('sinai-theme')||'auto';
let wk=sow(new Date()),editId=null,type='event',S={members:[],items:[],notes:[],rewards:[],urgent:[]},chan=null;
const fail=e=>alert('משהו השתבש: '+(e.message||e));
const mem=id=>S.members.find(m=>m.id===id)||{name:'ללא שיוך',color:'#999'};
const linked=it=>it.ms&&it.ms.length?it.ms:(it.m?[it.m]:[]);
const eventDots=it=>linked(it).length?linked(it).map(id=>`<i class="dot" style="background:${esc(mem(id).color)}"></i>`).join(''):'<i class="dot" style="background:#b4afa8"></i>';
const show=x=>['login','denied','app'].forEach(k=>$('#'+k).classList.toggle('hid',k!==x));

/* ---- loading data from the database ---- */
async function reload(t){
  const{data,error}=await db.from(t==='notes'?'week_notes':t==='rewards'?'daily_rewards':t==='urgent'?'urgent_messages':t).select('*').order('created_at');
  if(error)return fail(error);
  if(t==='members')S.members=data.map(r=>({id:r.id,name:r.name,color:r.color}));
  else if(t==='items')S.items=data.map(r=>({id:r.id,type:r.type,title:r.title,date:r.item_date,time:(r.item_time||'').slice(0,5),m:r.member_id,ms:Array.isArray(r.member_ids)?r.member_ids:(r.member_id?[r.member_id]:[]),rec:r.recurring,done:r.done}));
  else if(t==='rewards')S.rewards=data.map(r=>({id:r.id,date:r.reward_date,child:r.child}));
  else if(t==='urgent'){S.urgent=data.map(r=>({id:r.id,content:r.content,done:r.is_done}));drawUrgent();}
  else S.notes=data.map(r=>({id:r.id,w:r.week_start,text:r.content}));
  render();
}
function subscribe(){
  if(chan)db.removeChannel(chan);
  chan=db.channel('family');
  [['members','members'],['items','items'],['week_notes','notes'],['daily_rewards','rewards'],['urgent_messages','urgent']].forEach(([tb,k])=>
    chan.on('postgres_changes',{event:'*',schema:'public',table:tb},()=>reload(k)));
  chan.subscribe();
}

/* ---- login ---- */
async function enter(){
  const{data:{session}}=await db.auth.getSession();
  if(!session)return show('login');
  const{data,error}=await db.from('family_access').select('user_id').maybeSingle();
  if(error||!data)return show('denied');
  show('app');
  await Promise.all(['members','items','notes','rewards','urgent'].map(reload));
  subscribe();
}
db.auth.onAuthStateChange(ev=>{
  if(ev==='SIGNED_OUT'){if(chan)db.removeChannel(chan);chan=null;S={members:[],items:[],notes:[],rewards:[],urgent:[]};show('login')}
  else if(ev==='SIGNED_IN'||ev==='INITIAL_SESSION')setTimeout(enter,0);
});
$('#lf').onsubmit=async e=>{
  e.preventDefault();$('#lerr').textContent='';
  const{error}=await db.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
  if(error)$('#lerr').textContent='אימייל או סיסמה שגויים';
};
document.querySelectorAll('.out').forEach(b=>b.onclick=()=>db.auth.signOut());
/* ---- urgent notices ---- */
function drawUrgent(){
 const active=(S.urgent||[]).filter(m=>!m.done);
 $('#urgentList').innerHTML=active.length?active.map(m=>`<div class="urgent-row"><span>${esc(m.content)}</span><button class="urgentDone" data-id="${m.id}">✓ בוצע</button></div>`).join(''):'<p class="sub">אין הודעות דחופות פעילות.</p>';
 $('#urgentBanner').classList.toggle('hid',!active.length);
 $('#urgentBanner').innerHTML=active.length?`<h2>❗ הודעות דחופות (${active.length})</h2>`+active.map(m=>`<div class="urgent-banner-row"><span>${esc(m.content)}</span><button class="urgentDone" data-id="${m.id}">✓ בוצע</button></div>`).join(''):'';
 $('#urgentTop').textContent=active.length?`הודעה דחופה (${active.length}) !`:'הודעה דחופה !';
}
$('#urgentTop').onclick=()=>{$('#urgentError').textContent='';drawUrgent();$('#ovUrgent').classList.add('on')};
$('#urgentClose').onclick=()=>$('#ovUrgent').classList.remove('on');
$('#urgentAdd').onclick=async()=>{
 const content=$('#urgentInput').value.trim();if(!content){$('#urgentError').textContent='יש להקליד הודעה';return}
 const btn=$('#urgentAdd');btn.disabled=true;$('#urgentError').textContent='';
 try{
  const {error}=await db.from('urgent_messages').insert({content});if(error)throw error;
  $('#urgentInput').value='';
  $('#ovUrgent').classList.remove('on');
  await reload('urgent');
 }catch(e){$('#urgentError').textContent='לא הצלחנו לשמור את ההודעה. '+(e.message||'בדקו את החיבור ונסו שוב');}
 finally{btn.disabled=false}
};
async function completeUrgent(b){
 if(!b)return; b.disabled=true;
 const id=b.dataset.id;
 try{
  const {error}=await db.from('urgent_messages').update({is_done:true,completed_at:new Date().toISOString()}).eq('id',id);
  if(error)throw error;
  S.urgent=S.urgent.map(m=>m.id===id?{...m,done:true}:m);
  drawUrgent();await reload('urgent');
 }catch(e){fail(e);b.disabled=false}
}
$('#urgentList').onclick=e=>completeUrgent(e.target.closest('.urgentDone'));
$('#urgentBanner').onclick=e=>completeUrgent(e.target.closest('.urgentDone'));
// Periodic refresh also works if realtime is unavailable.
setInterval(()=>{if(!$('#app').classList.contains('hid'))reload('urgent')},60000);


/* ---- drawing the week ---- */
function itemsOn(ds){
  const wd=parse(ds).getDay();
  return S.items.filter(i=>i.date===ds||(i.rec&&i.type==='event'&&i.date<ds&&parse(i.date).getDay()===wd))
   .sort((a,b)=>(a.time||'').localeCompare(b.time||''));
}
const wn=()=>S.notes.filter(n=>n.w===iso(wk));
function render(){
 const end=addD(wk,6);
 const monthDate=wk;
 $('#range').textContent=viewMode==='week'?wk.getDate()+' '+MON[wk.getMonth()]+' – '+end.getDate()+' '+MON[end.getMonth()]+' '+end.getFullYear():MON[monthDate.getMonth()]+' '+monthDate.getFullYear();
 $('#legend').innerHTML=S.members.map(m=>`<span class="chip"><i class="dot" style="--c:${m.color}"></i>${esc(m.name)}</span>`).join('');
 $('#modeWeek').classList.toggle('active',viewMode==='week');$('#modeMonth').classList.toggle('active',viewMode==='month');
 $('#modeWeek').setAttribute('aria-pressed',viewMode==='week');$('#modeMonth').setAttribute('aria-pressed',viewMode==='month');
 $('#grid').classList.toggle('hid',viewMode!=='week');$('#monthGrid').classList.toggle('hid',viewMode!=='month');$('#monthDetail').classList.toggle('hid',viewMode!=='month');
 const today=iso(new Date());
 if(viewMode==='week'){
  let h='';
  for(let i=0;i<7;i++){
   const dt=addD(wk,i),ds=iso(dt),events=itemsOn(ds),isOpen=openedDay===ds;
   const brief=events.slice(0,isOpen?100:2).map(it=>`<div class="preview-row"><span class="event-dots">${eventDots(it)}</span><span class="name">${esc(it.title)}${it.done?' ✓':''}</span>${it.time?`<span class="time">${esc(it.time)}</span>`:''}</div>`).join('') || '<span class="empty">אין אירועים</span>';
   h+=`<section class="day${ds===today?' today':''}"><button class="day-toggle" data-open="${ds}" aria-expanded="${isOpen}"><span class="day-title"><b>${DAYS[i]}</b><small>${dt.getDate()}/${dt.getMonth()+1}</small></span><span class="preview">${brief}${!isOpen&&events.length>2?`<span class="more">ועוד ${events.length-2} אירועים</span>`:''}</span><span class="toggle-arrow">${isOpen?'⌃':'⌄'}</span></button>`;
   if(isOpen){
    h+=`<div class="day-detail">`+events.map(it=>{const c=esc(mem(it.m).color);if(it.type==='task')return `<div class="it task${it.done?' done':''}" style="--c:${c}" data-id="${it.id}"><input type="checkbox" class="ck" data-id="${it.id}" ${it.done?'checked':''} style="width:auto"><span class="x">${esc(it.title)}</span></div>`;return `<div class="it" style="--c:${c}" data-id="${it.id}" data-d="${ds}">${it.time?`<span class="t">${esc(it.time)}</span>`:''}${esc(it.title)}${it.rec?' <span class="rec">↻</span>':''}</div>`}).join('');
    const heart=S.rewards.some(r=>r.date===ds&&r.child==='tamara'),crown=S.rewards.some(r=>r.date===ds&&r.child==='yehonatan');
    h+=`<div class="reward-controls"><button class="rw${heart?' earned':''}" data-day="${ds}" data-child="tamara" aria-pressed="${heart}">♥ תמרה</button><button class="rw${crown?' earned':''}" data-day="${ds}" data-child="yehonatan" aria-pressed="${crown}">♛ יהונתן</button></div><button class="add" data-d="${ds}">+ הוסף ליום הזה</button></div>`;
   }
   h+='</section>';
  }
  $('#grid').innerHTML=h;
 }else{
  const first=new Date(wk.getFullYear(),wk.getMonth(),1),s=sow(first);
  let html=DAYS.map(d=>`<span class="month-weekday">${d.slice(0,1)}</span>`).join('');
  for(let i=0;i<42;i++){
   const dt=addD(s,i),ds=iso(dt),out=dt.getMonth()!==first.getMonth();
   html+=`<button class="month-day${out?' outside':''}${ds===selectedMonthDay?' selected':''}${ds===today?' today':''}" data-select="${ds}" aria-label="${DAYS[dt.getDay()]} ${ds}"><span>${dt.getDate()}</span>${itemsOn(ds).length?'<i class="count"></i>':''}</button>`;
  }
  $('#monthGrid').innerHTML=html;
  const d=parse(selectedMonthDay),events=itemsOn(selectedMonthDay);
  $('#monthDetail').innerHTML=`<strong>${DAYS[d.getDay()]} · ${d.getDate()}/${d.getMonth()+1}</strong>`+(events.map(it=>`<div class="event" data-id="${it.id}">${it.time?`<span class="time">${esc(it.time)} · </span>`:''}${esc(it.title)}${it.done?' ✓':''}</div>`).join('')||'<p class="empty">אין אירועים ביום הזה</p>')+`<div class="actions"><button class="add" data-d="${selectedMonthDay}">+ הוסף ליום הזה</button><button id="monthGoDay">פתח יום בשבוע</button></div>`;
 }
 $('#notes').innerHTML=wn().map((n,i)=>`<li><span>${esc(n.text)}</span><button data-n="${i}">✕</button></li>`).join('');
}
$('#grid').onclick=async e=>{
 const toggle=e.target.closest('[data-open]');if(toggle){openedDay=openedDay===toggle.dataset.open?null:toggle.dataset.open;render();return}
  const rewardButton=e.target.closest('.rw');
  if(rewardButton){
    const ds=rewardButton.dataset.day, child=rewardButton.dataset.child;
    if(!['tamara','yehonatan'].includes(child)||!/^\d{4}-\d{2}-\d{2}$/.test(ds))return;
    rewardButton.disabled=true;
    const existing=S.rewards.find(r=>r.date===ds&&r.child===child);
    const {error}=existing
      ?await db.from('daily_rewards').delete().eq('id',existing.id)
      :await db.from('daily_rewards').insert({reward_date:ds,child});
    if(error)fail(error);
    await reload('rewards');
    return;
  }
  const ck=e.target.closest('.ck');
  if(ck){const it=S.items.find(i=>i.id===ck.dataset.id);it.done=ck.checked;render();
    const{error}=await db.from('items').update({done:ck.checked}).eq('id',it.id);if(error){fail(error);reload('items')}return}
  const it=e.target.closest('.it');
  if(it){openM(it.dataset.id);return}
  const a=e.target.closest('[data-d]');
  if(a)openM(null,a.dataset.d);
};
$('#notes').onclick=async e=>{const n=e.target.dataset.n;if(n==null)return;
  const{error}=await db.from('week_notes').delete().eq('id',wn()[+n].id);if(error)return fail(error);reload('notes')};
$('#noteAdd').onclick=async()=>{const v=$('#noteIn').value.trim();if(!v)return;
  const{error}=await db.from('week_notes').insert({week_start:iso(wk),content:v});if(error)return fail(error);$('#noteIn').value='';reload('notes')};
$('#prev').onclick=()=>{wk=viewMode==='week'?addD(wk,-7):new Date(wk.getFullYear(),wk.getMonth()-1,1);openedDay=null;render()};
$('#next').onclick=()=>{wk=viewMode==='week'?addD(wk,7):new Date(wk.getFullYear(),wk.getMonth()+1,1);openedDay=null;render()};
$('#today').onclick=()=>{wk=viewMode==='week'?sow(new Date()):new Date(new Date().getFullYear(),new Date().getMonth(),1);selectedMonthDay=iso(new Date());openedDay=null;render()};
$('#modeWeek').onclick=()=>{viewMode='week';wk=sow(wk);openedDay=null;render()};
$('#modeMonth').onclick=()=>{viewMode='month';wk=new Date(wk.getFullYear(),wk.getMonth(),1);selectedMonthDay=iso(new Date(wk.getFullYear(),wk.getMonth(),1));render()};
$('#monthGrid').onclick=e=>{const b=e.target.closest('[data-select]');if(b){selectedMonthDay=b.dataset.select;render()}};
$('#monthDetail').onclick=e=>{const add=e.target.closest('[data-d]');if(add){openM(null,add.dataset.d);return}const it=e.target.closest('[data-id]');if(it){openM(it.dataset.id);return}if(e.target.closest('#monthGoDay')){wk=sow(parse(selectedMonthDay));viewMode='week';openedDay=selectedMonthDay;render()}};
$('#addTop').onclick=()=>openM(null,viewMode==='month'?selectedMonthDay:iso(new Date()));
$('#mgrTop').onclick=()=>{drawMembers();$('#ovM').classList.add('on')};
function applyTheme(){const dark=themePref==='dark'||(themePref==='auto'&&window.matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=dark?'dark':'light';$('#themeToggle').textContent=themePref==='light'?'☀':themePref==='dark'?'☾':'◐';$('#themeToggle').title='מצב תצוגה: '+(themePref==='light'?'בהיר':themePref==='dark'?'כהה':'אוטומטי')}
$('#themeToggle').onclick=()=>{themePref=themePref==='auto'?'light':themePref==='light'?'dark':'auto';localStorage.setItem('sinai-theme',themePref);applyTheme()};
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);applyTheme();

/* ---- add / edit window ---- */
function setType(t){type=t;$('#tyE').classList.toggle('on',t==='event');$('#tyT').classList.toggle('on',t==='task');
  $('#fH').style.display=$('#lT').style.display=$('#lR').style.display=t==='event'?'':'none';}
$('#tyE').onclick=()=>setType('event');$('#tyT').onclick=()=>setType('task');
function openM(id,ds){
  editId=id;const it=id?S.items.find(i=>i.id===id):null;
  $('#mt').textContent=it?'עריכה':'הוספה';
  const selectedIds=it?linked(it):[];
  $('#fMembers').innerHTML=S.members.map(m=>`<label class="family-option"><input type="checkbox" value="${esc(m.id)}" ${selectedIds.includes(m.id)?'checked':''}><i class="dot" style="--c:${esc(m.color)}"></i><span>${esc(m.name)}</span></label>`).join('')||'<p class="sub">אין בני משפחה — האירוע יישאר ללא שיוך.</p>';
  setType(it?it.type:'event');
  $('#fT').value=it?it.title:'';$('#fD').value=it?it.date:ds;$('#fH').value=it&&it.time||'';
  $('#fR').checked=!!(it&&it.rec);
  $('#del').style.display=it?'':'none';$('#ov').classList.add('on');$('#fT').focus();
}
const closeM=()=>{if(document.activeElement instanceof HTMLElement)document.activeElement.blur();$('#ov').classList.remove('on');window.scrollTo({left:0,top:window.scrollY,behavior:'instant'});};
$('#cx').onclick=closeM;
$('#sv').onclick=async()=>{
  const title=$('#fT').value.trim();if(!title||!$('#fD').value){$('#fT').focus();return}
  const assigned=[...document.querySelectorAll('#fMembers input:checked')].map(el=>el.value);
  const isE=type==='event',row={type,title,item_date:$('#fD').value,member_id:assigned[0]||null,member_ids:assigned,
    item_time:isE&&$('#fH').value?$('#fH').value:null,recurring:isE&&$('#fR').checked};
  const{error}=editId?await db.from('items').update(row).eq('id',editId):await db.from('items').insert(row);
  if(error)return fail(error);
  closeM();reload('items');
};
$('#del').onclick=async()=>{if(!confirm('למחוק? (באירוע חוזר, יימחקו כל החזרות)'))return;
  const{error}=await db.from('items').delete().eq('id',editId);if(error)return fail(error);closeM();reload('items')};

/* ---- family members ---- */
function drawMembers(){$('#mList').innerHTML=S.members.map(m=>`<div class="chip" style="margin:3px"><i class="dot" style="--c:${m.color}"></i>${esc(m.name)} <button data-md="${m.id}" style="padding:0 6px">✕</button></div>`).join('')}
$('#mList').onclick=async e=>{const id=e.target.dataset.md;if(!id||!confirm('להסיר את בן המשפחה? האירועים שלו יישארו בלי צבע.'))return;
  const{error}=await db.from('members').delete().eq('id',id);if(error)return fail(error);await reload('members');reload('items');drawMembers()};
$('#mAdd').onclick=async()=>{const n=$('#mN').value.trim();if(!n)return;
  const{error}=await db.from('members').insert({name:n,color:$('#mC').value});if(error)return fail(error);$('#mN').value='';await reload('members');drawMembers()};
$('#mX').onclick=()=>$('#ovM').classList.remove('on');
</script>
</body>
