<script>
/* Sinai candle-lighting times for Geulim, Israel. Visible only on Fridays. */
window.SinaiCandles=(()=>{
 const times=new Map(), loaded=new Set(), loading=new Set(), callbacks=[];
 function notify(){callbacks.forEach(cb=>cb())}
 async function load(year){
  if(loaded.has(year)||loading.has(year))return;
  loading.add(year);
  try{
   const key='sinai-candles-geulim-v1-'+year;
   let items=null;
   try{const cached=JSON.parse(localStorage.getItem(key)||'null');if(cached&&Date.now()-cached.saved<7*86400000)items=cached.items}catch{}
   if(!items){
    const q=new URLSearchParams({v:'1',cfg:'json',year:String(year),yt:'G',i:'on',c:'on',b:'20',latitude:'32.29956',longitude:'34.94647',tzid:'Asia/Jerusalem',lg:'he'});
    const r=await fetch('https://www.hebcal.com/hebcal?'+q.toString());
    if(!r.ok)throw Error('Hebcal '+r.status);
    items=(await r.json()).items||[];
    try{localStorage.setItem(key,JSON.stringify({saved:Date.now(),items}))}catch{}
   }
   for(const item of items){
    if(item.category!=='candles'||!item.date)continue;
    const date=String(item.date).slice(0,10);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date))continue;
    // Only Friday candle lighting, not other festival candle-lighting dates.
    const [y,m,d]=date.split('-').map(Number);
    if(new Date(y,m-1,d).getDay()!==5)continue;
    const instant=new Date(item.date);
    if(!Number.isFinite(instant.getTime()))continue;
    times.set(date,new Intl.DateTimeFormat('he-IL',{timeZone:'Asia/Jerusalem',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(instant));
   }
   loaded.add(year);notify();
  }catch(e){console.warn('Geulim candle-lighting unavailable',e)}
  finally{loading.delete(year)}
 }
 function ensure(date){void load(date.getFullYear());if(date.getMonth()===11)void load(date.getFullYear()+1)}
 function get(date){return times.get(date)||''}
 function onChange(cb){callbacks.push(cb)}
 return{ensure,get,onChange};
})();
</script>
<script>
/* Sinai public holiday overlay: Israel calendar, never persisted to family tables. */
window.SinaiHolidays=(()=>{
 const records=new Map(),loaded=new Set(),loading=new Set(),listeners=[];
 const rules=[
  [/^Rosh Hashana/i,'ראש השנה'],[/^Yom Kippur/i,'יום כיפור'],[/^Sukkot/i,'סוכות'],
  [/^(Shmini Atzeret|Shemini Atzeret|Simchat Torah)/i,'שמיני עצרת ושמחת תורה'],
  [/^(Chanukah|Hanukkah)/i,'חנוכה'],[/^Tu BiShvat/i,'ט״ו בשבט'],
  [/^Purim(?! Katan)(?:$|\s)/i,'פורים'],[/^Pesach(?! Sheni)/i,'פסח'],[/^Shavuot/i,'שבועות'],
  [/^Lag BaOmer/i,'ל״ג בעומר'],[/^Yom HaShoah/i,'יום השואה'],
  [/^Yom HaZikaron/i,'יום הזיכרון'],[/^Yom HaAtzma.?ut/i,'יום העצמאות'],
  [/^Yom Yerushalayim/i,'יום ירושלים'],[/^Tish(?:a|ah) B.Av/i,'תשעה באב']
 ];
 function choose(item){
  const title=String(item.title||'');
  if(/^(Erev|Leil|Shabbat|Rosh Chodesh|Asara|Ta.anit)/i.test(title))return null;
  const rule=rules.find(([re])=>re.test(title));
  return rule?rule[1]:null;
 }
 const notify=()=>listeners.forEach(f=>f());
 const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
 async function load(year){
  if(loaded.has(year)||loading.has(year))return;
  loading.add(year);
  try{
   const cacheKey='sinai-holidays-il-v1-'+year;
   let payload=null;
   try{const cache=JSON.parse(localStorage.getItem(cacheKey)||'null');if(cache&&Date.now()-cache.saved<14*86400000)payload=cache.items}catch{}
   if(!payload){
    const params=new URLSearchParams({v:'1',cfg:'json',year:String(year),yt:'G',i:'on',maj:'on',min:'on',mod:'on',lg:'en'});
    const response=await fetch('https://www.hebcal.com/hebcal?'+params.toString());
    if(!response.ok)throw new Error('Hebcal '+response.status);
    const json=await response.json();payload=json.items||[];
    try{localStorage.setItem(cacheKey,JSON.stringify({saved:Date.now(),items:payload}))}catch{}
   }
   for(const item of payload){
    const label=choose(item);
    if(!label||!/^\d{4}-\d{2}-\d{2}$/.test(item.date||''))continue;
    const entries=records.get(item.date)||[];
    if(!entries.includes(label))entries.push(label);
    records.set(item.date,entries);
   }
   loaded.add(year);notify();
  }catch(err){console.warn('Holiday overlay unavailable',err)}
  finally{loading.delete(year)}
 }
 function ensure(date){const year=date.getFullYear();for(const y of [year-1,year,year+1])void load(y)}
 function get(date){return records.get(typeof date==='string'?date:key(date))||[]}
 function onChange(cb){listeners.push(cb)}
 return{ensure,get,onChange};
})();
</script>

<script>

let anchor=new Date(),mode='week',state={members:[],items:[],rewards:[],urgent:[]},channel=null,active=false,busy=false;

async function load(){

 busy=true;
 try{
  const [m,i,r,u]=await Promise.all([db.from('members').select('id,name,color'),db.from('items').select('id,type,title,item_date,item_time,member_id,recurring,done'),db.from('daily_rewards').select('reward_date,child'),db.from('urgent_messages').select('id,content,is_done,created_at').eq('is_done',false).order('created_at')]);

 for(const t of ['items','members','daily_rewards','urgent_messages'])channel.on('postgres_changes',{event:'*',schema:'public',table:t},()=>load());
 channel.subscribe(s=>{if(s==='SUBSCRIBED')load();});
}

 const {data:{session},error}=await db.auth.getSession();
 if(error||!session){stopUpdates();show('login');return}
 const access=await db.from('family_access').select('user_id').eq('user_id',session.user.id).maybeSingle();
 if(access.error||!access.data){stopUpdates();show('denied');return}
 active=true;show('screen');await load();setupRealtime();
}
db.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT'){stopUpdates();show('login')}else if(event==='SIGNED_IN'||event==='INITIAL_SESSION'||event==='TOKEN_REFRESHED'){setTimeout(enter,0)}});
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='';

 else{$('password').value='';await enter()}
};
$('logout').onclick=$('deniedLogout').onclick=()=>db.auth.signOut();
function eventsOn(date){const wd=parse(date).getDay();return state.items.filter(i=>i.item_date===date||(i.recurring&&i.type==='event'&&i.item_date<date&&parse(i.item_date).getDay()===wd)).sort((a,b)=>(a.item_time||'').localeCompare(b.item_time||''))}
function eventHtml(e){
 const member=state.members.find(m=>m.id===e.member_id);
 const time=(e.item_time||'').slice(0,5);
 return `<div class="event"><div class="time">${time?esc(time):'ללא שעה'}${e.type==='task'?' · משימה':''}</div><div class="title">${esc(e.title)}${e.done?' ✓':''}</div>${member?`<div class="people">${esc(member.name)}</div>`:''}</div>`;

function rewardHtml(ds){

 return `<div class="rewards"><div class="reward"><span>תמרה</span><span class="symbol">${values.has('tamara')?'♥':'—'}</span></div><div class="reward"><span>יהונתן</span><span class="symbol">${values.has('yehonatan')?'♛':'—'}</span></div></div>`;

function draw(){
 SinaiHolidays.ensure(anchor);
 SinaiCandles.ensure(anchor);
